[project]
name = "mcp-camara-pecs"
version = "0.1.0"
description = "Servidor MCP para votações e tramitações de PECs via API de Dados Abertos da Câmara dos Deputados"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gustavo Contiero", email = "gcontiero011@gmail.com" }]
keywords = ["mcp", "camara", "pec", "votacoes", "dados-abertos", "govtech"]
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
host = [
    "ollama>=0.3",
    "rich>=13",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
mcp-camara-pecs = "mcp_camara_pecs.server:main"
pecs-host = "pecs_host.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_camara_pecs", "src/pecs_host"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
